# Jynx — webpage/text-to-quiz POC (two services: FastAPI backend + Next.js frontend).
# The OpenAI-compatible LLM endpoint (Olla/Ollama) is EXTERNAL and not part of this stack.
# (The obsolete top-level `version` key is intentionally omitted.)

services:
  backend:
    build: ./backend
    # Publishing 8000 is optional now that the frontend proxies /api/* internally
    # (over the compose network). Kept for direct curl / eval access; remove for a
    # single-entry-point setup where only the frontend port is exposed.
    ports:
      - "8000:8000"
    environment:
      # OpenAI-compatible endpoint config. Defaults match the backend's own defaults.
      # To reach an LLM endpoint running on the HOST machine, set:
      #   OPENAI_BASE_URL=http://host.docker.internal:40114/v1
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-http://localhost:40114/v1}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-ollama}
      - OPENAI_MODEL=${OPENAI_MODEL:-qwen2.5:14b}
    # Lets the container resolve `host.docker.internal` to the host, so the backend
    # can reach an OpenAI-compatible endpoint running on the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      args:
        # Server-side proxy target: the Next server forwards /api/* here over the
        # compose network. Baked when `next build` runs, so it's a build ARG.
        # The browser only ever calls the frontend origin (relative /api/...),
        # so this works from any device with no IP to configure and no CORS.
        BACKEND_ORIGIN: ${BACKEND_ORIGIN:-http://backend:8000}
        # Optional: set to bypass the proxy and call a backend directly.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
    environment:
      - BACKEND_ORIGIN=${BACKEND_ORIGIN:-http://backend:8000}
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-}
    ports:
      - "4000:4000"
    depends_on:
      - backend
